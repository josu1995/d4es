name: Paginas de build (Playwright)

# El equipo y el Paragon solo existen en la pagina de cada build, montada por JavaScript.
# Desde la red de trabajo d4builds esta bloqueado, asi que este workflow es el unico sitio
# donde se puede ejecutar el navegador: se dispara con cada push al scraper y devuelve el
# resultado commiteado, que es como se itera sobre los parsers.

on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'probe (reconocimiento del DOM) o scrape (extraccion real)'
        required: false
        default: 'scrape'
      objetivo:
        description: 'uuid concreto, o --limite=N, o vacio para todas'
        required: false
        default: ''
      forzar:
        description: 'true para re-extraer paginas ya descargadas (tras arreglar un parser)'
        required: false
        default: 'false'
  push:
    branches: [main]
    paths:
      - 'apps/scraper/src/sources/d4builds/probe-page.ts'
      - 'apps/scraper/src/sources/d4builds/scrape-pages.ts'
      - 'apps/scraper/src/sources/d4builds/warplans.ts'
      - 'apps/scraper/src/sources/d4builds/mercenarios.ts'
      - '.github/workflows/scrape-pages.yml'
  schedule:
    # Diario. El checkpoint hace que solo se pidan las paginas que faltan, asi que en
    # regimen normal esta pasada no descarga casi nada: solo recoge las builds nuevas
    # que haya publicado el catalogo.
    - cron: '43 3 * * *'

concurrency:
  group: scrape-pages
  # NO se cancela la extraccion en curso: son decenas de minutos de trabajo y un push
  # cualquiera al scraper la tiraria entera. Las pasadas se encolan.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  paginas:
    runs-on: ubuntu-latest
    # Generoso a proposito: son ~92 paginas con varias pestanas cada una. El scraper
    # lleva su propio presupuesto de tiempo mas corto para salir limpiamente y publicar.
    # Desde los planes de guerra cada pagina cuesta ~10 s mas (siete solapas que hay que
    # pulsar una a una), asi que caben ocho lotes de 14 min y sobra margen.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          # Historia completa. El repo pesa ~7 MB, asi que es gratis, y hace falta para
          # saber que ficheros trae el push mirando el diff de verdad.
          fetch-depth: 0
          # El TIP de main, no el commit que disparo el run. Las pasadas se ENCOLAN
          # (concurrency sin cancelar), asi que cuando esta arranca, main puede llevar
          # lotes que el commit disparador no tenia; partir del commit viejo hizo que la
          # primera publicacion chocara al rebasar y el run 31323290074 perdiera 44 min
          # de extraccion entera. El diff de decision usa github.event.before igualmente.
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Compilar paquetes
        run: npm run build:pkgs

      # Un push que solo toca la SONDA no puede costar una re-extraccion completa de las
      # 92 paginas (que es lo que hace el paso de extraer cuando el evento es push).
      # Se mira que ficheros trae el push: si el parser no cambio, esta pasada es sonda.
      #
      # Se decide con `git diff`, NO con el payload del evento. Dos intentos con
      # `github.event.commits` fallaron en silencio y se comieron dos rondas de CI:
      # `join(commits.*.modified, ',')` devuelve vacio (es un array de arrays) y buscar la
      # ruta dentro de `toJSON(commits)` tampoco caso. El diff de git es comprobable.
      #
      # Parser = scrape-pages.ts, warplans.ts Y mercenarios.ts: los tres cambian lo que
      # se extrae. Solo probe-page.ts se queda en sonda, porque no toca los datos.
      - name: Decidir que hace este push
        id: plan
        if: github.event_name == 'push'
        env:
          ANTES: ${{ github.event.before }}
        run: |
          base="$ANTES"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="HEAD^"
          fi
          cambiados=$(git diff --name-only "$base" HEAD || true)

          if echo "$cambiados" | grep -qE '^apps/scraper/src/sources/d4builds/(scrape-pages|warplans|mercenarios)\.ts$'; then
            modo=scrape
          else
            modo=probe
          fi
          echo "modo=$modo" >> "$GITHUB_OUTPUT"

          # Queda por escrito en el repo: sin esto, saber que decidio el workflow exige
          # abrir los logs a mano, y por eso las dos veces anteriores paso desapercibido.
          mkdir -p data/reports
          printf '{\n  "evento": "push",\n  "run": "%s",\n  "base": "%s",\n  "modo": "%s",\n  "ficheros": %s\n}\n' \
            "${{ github.run_id }}" "$base" "$modo" \
            "$(echo "$cambiados" | grep -v '^$' | sed 's/.*/"&"/' | paste -sd, - | sed 's/^/[/;s/$/]/')" \
            > data/reports/ultimo-disparo.json

          {
            echo "Modo: **$modo**"
            echo '```'
            echo "$cambiados"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sonda de reconocimiento
        if: github.event.inputs.modo == 'probe' || steps.plan.outputs.modo == 'probe'
        run: node apps/scraper/dist/cli.js probe:page ${{ github.event.inputs.objetivo }}

      # Se extrae POR LOTES y se publica despues de cada uno. Asi una cancelacion o un
      # fallo a mitad no tira todo el trabajo: la siguiente pasada arranca donde se
      # quedo, porque el extractor se salta las paginas que ya estan en disco.
      - name: Extraer y publicar por lotes
        if: (github.event_name != 'push' && github.event.inputs.modo != 'probe') || steps.plan.outputs.modo == 'scrape'
        run: |
          git config user.name "d4es-bot"
          git config user.email "bot@users.noreply.github.com"

          # Tras arreglar un parser hay que volver a pedir todo: el checkpoint saltaria
          # las paginas ya descargadas y seguiriamos con los datos mal extraidos. Se
          # borran de golpe al empezar, en vez de pasar --forzar en cada lote (que haria
          # que los lotes 2..6 no encontraran nada pendiente y se pararan en seco).
          if [ "${{ github.event.inputs.forzar }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "Re-extraccion completa: se descartan las paginas anteriores."
            rm -rf data/raw/d4builds/pages
          fi

          # Publica el lote y FALLA EN ROJO si no puede. La version anterior hacia
          # `git pull --rebase && git push` a secas: un conflicto al rebasar (paso en el
          # run 31323290074, con data/reports/scrape-pages.json) dejaba el repo a medio
          # rebase, los lotes siguientes commiteaban en detached HEAD, ningun push
          # llegaba a main y el paso terminaba "success" habiendo perdido 44 minutos de
          # extraccion. `-X theirs` resuelve a favor de lo recien extraido (en rebase,
          # "theirs" es NUESTRO commit replayado), que para las paginas y el informe es
          # siempre lo mas nuevo.
          publicar() {
            for intento in 1 2 3; do
              if git pull --rebase --autostash -X theirs && git push; then
                return 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            return 1
          }

          for lote in 1 2 3 4 5 6 7 8; do
            echo "::group::Lote $lote"
            node apps/scraper/dist/cli.js scrape:pages --minutos=14 ${{ github.event.inputs.objetivo }} || true
            echo "::endgroup::"

            if [ -n "$(git status --porcelain data/)" ]; then
              git add data/
              git commit -m "paginas: lote $lote (run ${{ github.run_id }}) [skip netlify]"
              if ! publicar; then
                echo "::error::El lote $lote no se pudo publicar (rebase/push): se corta aqui para no seguir en un estado roto."
                echo "Lote $lote SIN PUBLICAR: el paso falla a proposito." >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
              echo "Lote $lote publicado." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Lote $lote sin cambios: no queda nada por extraer." >> "$GITHUB_STEP_SUMMARY"
              break
            fi
          done

          total=$(ls data/canonical/builds/*/*.json 2>/dev/null | wc -l)
          paginas=$(ls data/raw/d4builds/pages/*.json 2>/dev/null | wc -l)
          echo "Paginas extraidas: $paginas de $total builds" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar sonda
        if: github.event.inputs.modo == 'probe' || steps.plan.outputs.modo == 'probe'
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "d4es-bot"
            git config user.email "bot@users.noreply.github.com"
            git add data/
            git commit -m "paginas: sonda del DOM (run ${{ github.run_id }}) [skip netlify]"
            git pull --rebase --autostash && git push
          fi
