[build]
  # El build compila los paquetes TS, valida los datos y luego construye la web. Si los
  # datos no validan, el despliegue falla antes de publicar nada.
  command = "npm run build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    # Los assets llevan hash en el nombre: se pueden cachear para siempre.
    Cache-Control = "public, max-age=31536000, immutable"
